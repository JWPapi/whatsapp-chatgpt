services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    restart: unless-stopped
    shm_size: '512m'
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PUPPETEER_CACHE_DIR=/app/.cache/puppeteer
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
    healthcheck:
      # Fail if heartbeat file is older than 15 minutes (900 seconds)
      test: ["CMD-SHELL", "[ -f /tmp/bot-heartbeat ] && [ $$(( $(date +%s) - $(cat /tmp/bot-heartbeat) )) -lt 900 ] || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
